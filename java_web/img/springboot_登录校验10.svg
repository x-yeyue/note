<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500">
  <defs>
    <!-- 阴影效果 -->
    <filter id="shadow-strong" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow-soft" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    
    <!-- 灰色箭头定义 -->
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
  </defs>

  <!-- 背景底色 -->
  <rect width="100%" height="100%" fill="#F5F6F7"/>

  <!-- ================= 最外层大虚线框 ================= -->
  <rect x="15" y="15" width="1570" height="470" rx="15" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- ================= 左侧：浏览器图标及文字 ================= -->
  <g transform="translate(110, 180)">
    <!-- Chrome 图标 -->
    <path d="M50 50 L50 0 A50 50 0 0 1 93.3 75 Z" fill="#EA4335"/>
    <path d="M50 50 L93.3 75 A50 50 0 0 1 6.7 75 Z" fill="#FBBC05"/>
    <path d="M50 50 L6.7 75 A50 50 0 0 1 50 0 Z" fill="#34A853"/>
    <circle cx="50" cy="50" r="23" fill="#4285F4"/>
    <circle cx="50" cy="50" r="30" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  </g>
  <text x="160" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#333333" text-anchor="middle">浏览器</text>

  <!-- ================= 中间：请求与响应箭头 ================= -->
  <!-- 请求箭头 -->
  <line x1="240" y1="230" x2="930" y2="230" stroke="#888888" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="580" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#333333" text-anchor="middle">请求</text>
  
  <!-- 响应箭头 -->
  <line x1="930" y1="310" x2="240" y2="310" stroke="#888888" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="580" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#333333" text-anchor="middle">响应</text>

  <!-- ================= 右侧：系统模块 ================= -->
  <!-- 浅蓝色大背景框 -->
  <rect x="945" y="45" width="610" height="410" rx="15" fill="#7CD2D8" filter="url(#shadow-soft)"/>
  <!-- 内部虚线框 -->
  <rect x="960" y="60" width="580" height="380" rx="10" fill="none" stroke="#B3E6E9" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 黄色 Interceptor 模块 -->
  <rect x="980" y="105" width="185" height="280" rx="15" fill="#FFC107" filter="url(#shadow-strong)"/>
  <!-- Interceptor 文字 (居中) -->
  <text x="1072.5" y="255" font-family="'Courier New', monospace, sans-serif" font-size="24" fill="#333333" text-anchor="middle" font-weight="bold">Interceptor</text>

  <!-- 绿色交互箭头 -->
  <g fill="#1BA63A">
    <!-- 指向右侧的箭头 -->
    <path d="M 1190 195 L 1225 195 L 1225 180 L 1255 210 L 1225 240 L 1225 225 L 1190 225 Z"/>
    <!-- 指向左侧的箭头 -->
    <path d="M 1255 275 L 1220 275 L 1220 260 L 1190 290 L 1220 320 L 1220 305 L 1255 305 Z"/>
  </g>

  <!-- 右侧深色按钮组 -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle">
    <!-- Login -->
    <rect x="1275" y="75" width="190" height="65" rx="10" fill="#2F4B5E" filter="url(#shadow-strong)"/>
    <text x="1370" y="116">Login</text>
    
    <!-- Emp -->
    <rect x="1275" y="170" width="190" height="65" rx="10" fill="#2F4B5E" filter="url(#shadow-strong)"/>
    <text x="1370" y="211">Emp</text>
    
    <!-- Dept -->
    <rect x="1275" y="265" width="190" height="65" rx="10" fill="#2F4B5E" filter="url(#shadow-strong)"/>
    <text x="1370" y="306">Dept</text>
    
    <!-- Report -->
    <rect x="1275" y="360" width="190" height="65" rx="10" fill="#2F4B5E" filter="url(#shadow-strong)"/>
    <text x="1370" y="401">Report</text>
  </g>

</svg>