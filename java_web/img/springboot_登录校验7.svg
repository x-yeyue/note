<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 20 760 1040" width="760" height="1040">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- 背景大虚线框 -->
  <rect x="150" y="50" width="700" height="980" rx="15" fill="#f4f4f4" stroke="#888" stroke-width="2" stroke-dasharray="8,6" filter="url(#shadow)"/>

  <!-- 节点 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#fff" text-anchor="middle">
    <!-- 1. 请求 -->
    <rect x="400" y="100" width="200" height="60" rx="30" fill="#777" stroke="#555" stroke-width="2" filter="url(#shadow)"/>
    <text x="500" y="138">请求</text>

    <!-- 2. 获取请求路径 -->
    <rect x="350" y="200" width="300" height="80" fill="#777" stroke="#555" stroke-width="2" filter="url(#shadow)"/>
    <text x="500" y="248">获取请求路径</text>

    <!-- 3. 判断是否是登录请求 (菱形) -->
    <polygon points="500,320 630,380 500,440 370,380" fill="#777" stroke="#555" stroke-width="2" filter="url(#shadow)"/>
    <text x="500" y="375">判断是否是<tspan x="500" dy="25">登录请求</tspan></text>

    <!-- 4. 获取请求头 token -->
    <rect x="350" y="480" width="300" height="80" fill="#777" stroke="#555" stroke-width="2" filter="url(#shadow)"/>
    <text x="500" y="528">获取请求头token</text>

    <!-- 5. 判断是否有 token (菱形) -->
    <polygon points="500,600 630,660 500,720 370,660" fill="#777" stroke="#555" stroke-width="2" filter="url(#shadow)"/>
    <text x="500" y="655">判断是否有<tspan x="500" dy="25">token</tspan></text>

    <!-- 6. 解析 token (菱形) -->
    <polygon points="500,760 630,820 500,880 370,820" fill="#777" stroke="#555" stroke-width="2" filter="url(#shadow)"/>
    <text x="500" y="828">解析token</text>

    <!-- 7. 响应 401 -->
    <rect x="680" y="630" width="150" height="60" rx="30" fill="#777" stroke="#555" stroke-width="2" filter="url(#shadow)"/>
    <text x="755" y="668">响应401</text>

    <!-- 8. 执行 -->
    <rect x="400" y="930" width="200" height="60" rx="30" fill="#777" stroke="#555" stroke-width="2" filter="url(#shadow)"/>
    <text x="500" y="968">执行</text>
  </g>

  <!-- 连线与箭头 -->
  <g stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <!-- 请求 -> 获取路径 -->
    <line x1="500" y1="160" x2="500" y2="195"/>
    <!-- 获取路径 -> 判断登录 -->
    <line x1="500" y1="280" x2="500" y2="315"/>
    <!-- 判断登录 -> 获取 token -->
    <line x1="500" y1="440" x2="500" y2="475"/>
    <!-- 获取 token -> 判断 token -->
    <line x1="500" y1="560" x2="500" y2="595"/>
    <!-- 判断 token -> 解析 token -->
    <line x1="500" y1="720" x2="500" y2="755"/>
    <!-- 判断 token -> 响应 401 (向右侧) -->
    <line x1="630" y1="660" x2="675" y2="660"/>

    <!-- 解析 token -> 执行 -->
    <line x1="500" y1="880" x2="500" y2="925"/>
    <!-- 解析 token -> 响应 401 (向右侧向下折线) -->
    <path d="M 630 820 L 755 820 L 755 695"/>

    <!-- 判断登录 -> 执行 (向左侧向下长折线) -->
    <path d="M 370 380 L 250 380 L 250 960 L 395 960"/>
  </g>

  <!-- 连线上的文字标签 -->
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" fill="#444" text-anchor="middle">
    <text x="520" y="465">否</text>
    <text x="520" y="745">是</text>
    <text x="650" y="645">否</text>
    <text x="650" y="800">失败</text>
    <text x="520" y="915">成功</text>
    <text x="225" y="670">是</text>
  </g>
</svg>