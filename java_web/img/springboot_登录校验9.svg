<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 550" width="2000" height="550">
  <defs>
    <!-- 阴影效果 -->
    <filter id="shadow-strong" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow-soft" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    
    <!-- 灰色箭头定义 -->
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
    
    <!-- 绿色箭头定义 -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1BA63A"/>
    </marker>
  </defs>

  <!-- 背景底色 -->
  <rect width="100%" height="100%" fill="#F5F6F7"/>

  <!-- ================= 最外层大虚线框 ================= -->
  <rect x="20" y="20" width="1960" height="510" rx="15" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- ================= 左侧：浏览器图标及文字 ================= -->
  <g transform="translate(150, 220)">
    <!-- Chrome 图标 -->
    <path d="M50 50 L50 0 A50 50 0 0 1 93.3 75 Z" fill="#EA4335"/>
    <path d="M50 50 L93.3 75 A50 50 0 0 1 6.7 75 Z" fill="#FBBC05"/>
    <path d="M50 50 L6.7 75 A50 50 0 0 1 50 0 Z" fill="#34A853"/>
    <circle cx="50" cy="50" r="23" fill="#4285F4"/>
    <circle cx="50" cy="50" r="30" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  </g>
  <text x="200" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#333333" text-anchor="middle">浏览器</text>

  <!-- ================= 中间：请求与响应箭头 ================= -->
  <!-- 请求箭头 -->
  <line x1="300" y1="270" x2="1020" y2="270" stroke="#888888" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="660" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#333333" text-anchor="middle">请求</text>
  
  <!-- 响应箭头 -->
  <line x1="1020" y1="340" x2="300" y2="340" stroke="#888888" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="660" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#333333" text-anchor="middle">响应</text>

  <!-- ================= 右侧：系统模块 ================= -->
  <!-- 浅蓝色大背景框 -->
  <rect x="1030" y="50" width="920" height="460" rx="15" fill="#7CD2D8" filter="url(#shadow-soft)"/>
  <!-- 内部虚线框 -->
  <rect x="1045" y="65" width="890" height="430" rx="10" fill="none" stroke="#B3E6E9" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 1. 黄色 Filter1 模块 -->
  <rect x="1070" y="120" width="130" height="280" rx="12" fill="#FFC107" filter="url(#shadow-strong)"/>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#333333" text-anchor="middle">
    <text x="1115" y="200">放行前</text>
    <text x="1115" y="270">放行</text>
    <text x="1115" y="340">放行后</text>
  </g>
  <!-- 带圈数字 1, 2, 7 -->
  <g stroke="#C62828" stroke-width="2" fill="none">
    <circle cx="1175" cy="192" r="14"/>
    <circle cx="1175" cy="262" r="14"/>
    <circle cx="1175" cy="332" r="14"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#C62828" text-anchor="middle" font-weight="bold">
    <text x="1175" y="199">1</text>
    <text x="1175" y="269">2</text>
    <text x="1175" y="339">7</text>
  </g>
  <text x="1135" y="455" font-family="'Courier New', monospace" font-size="28" fill="#333333" text-anchor="middle">Filter1</text>

  <!-- 2. 黄色 Filter2 模块 -->
  <rect x="1350" y="120" width="130" height="280" rx="12" fill="#FFC107" filter="url(#shadow-strong)"/>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#333333" text-anchor="middle">
    <text x="1395" y="200">放行前</text>
    <text x="1395" y="270">放行</text>
    <text x="1395" y="340">放行后</text>
  </g>
  <!-- 带圈数字 3, 4, 6 -->
  <g stroke="#C62828" stroke-width="2" fill="none">
    <circle cx="1455" cy="192" r="14"/>
    <circle cx="1455" cy="262" r="14"/>
    <circle cx="1455" cy="332" r="14"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#C62828" text-anchor="middle" font-weight="bold">
    <text x="1455" y="199">3</text>
    <text x="1455" y="269">4</text>
    <text x="1455" y="339">6</text>
  </g>
  <text x="1415" y="455" font-family="'Courier New', monospace" font-size="28" fill="#333333" text-anchor="middle">Filter2</text>

  <!-- 3. 绿色交互箭头 -->
  <!-- Filter1 -> Filter2 -->
  <line x1="1220" y1="245" x2="1325" y2="245" stroke="#1BA63A" stroke-width="8" marker-end="url(#arrow-green)"/>
  <!-- Filter2 -> 资源 (Emp位置) -->
  <line x1="1500" y1="220" x2="1600" y2="220" stroke="#1BA63A" stroke-width="8" marker-end="url(#arrow-green)"/>
  <!-- 资源 -> Filter2 (Dept位置) -->
  <line x1="1600" y1="290" x2="1505" y2="290" stroke="#1BA63A" stroke-width="8" marker-end="url(#arrow-green)"/>
  <!-- Filter2 -> Filter1 -->
  <line x1="1325" y1="315" x2="1225" y2="315" stroke="#1BA63A" stroke-width="8" marker-end="url(#arrow-green)"/>

  <!-- 4. 右侧深色按钮组 (资源) -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#FFFFFF" text-anchor="middle">
    <!-- Login -->
    <rect x="1620" y="90" width="180" height="60" rx="10" fill="#2F4B5E" filter="url(#shadow-strong)"/>
    <text x="1710" y="128">Login</text>
    
    <!-- Emp -->
    <rect x="1620" y="170" width="180" height="60" rx="10" fill="#2F4B5E" filter="url(#shadow-strong)"/>
    <text x="1710" y="208">Emp</text>
    
    <!-- Dept -->
    <rect x="1620" y="250" width="180" height="60" rx="10" fill="#2F4B5E" filter="url(#shadow-strong)"/>
    <text x="1710" y="288">Dept</text>
    
    <!-- Report -->
    <rect x="1620" y="330" width="180" height="60" rx="10" fill="#2F4B5E" filter="url(#shadow-strong)"/>
    <text x="1710" y="368">Report</text>
  </g>
  
  <!-- 资源下方文字 -->
  <text x="1710" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#333333" text-anchor="middle">资源</text>

  <!-- 5. 特殊编号 ⑤ (位于Filter2和资源之间) -->
  <g>
    <circle cx="1560" cy="255" r="15" fill="none" stroke="#C62828" stroke-width="2"/>
    <text x="1560" y="263" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#C62828" text-anchor="middle" font-weight="bold">5</text>
  </g>

</svg>